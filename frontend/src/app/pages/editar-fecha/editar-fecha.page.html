<ion-content [fullscreen]="true" class="edit-date-page">

  <!-- HEADER -->
  <div class="top-bar">
    <ion-icon
      name="chevron-back-outline"
      class="back-icon"
      (click)="goBack()">
    </ion-icon>

    <h1>Editar fecha</h1>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <p class="subtitle">
      Actualiza tu fecha de nacimiento para personalizar mejor tu experiencia.
    </p>

    <div class="form-card" [class.input-error]="mostrarErrorEdad">

      <label [class.label-error]="mostrarErrorEdad">
        Fecha de nacimiento
      </label>

      <div class="fake-input" (click)="abrirCalendario()">
        {{ getFechaFormateada() }}
        <span class="cal-icon">📅</span>
      </div>

    </div>

    <!-- ERROR EDAD -->
    <div class="error-edad" *ngIf="mostrarErrorEdad">
      <span class="error-icon">⛔</span>
      <span>Debes ser mayor de 18 años</span>
    </div>

  </div>

  <!-- CALENDARIO -->
  <div class="overlay" *ngIf="mostrarCalendario" (click)="cerrarCalendario()">

    <div class="calendar-box" (click)="$event.stopPropagation()">

      <div class="cal-fecha-header">
        <span>{{ fecha ? fechaHeaderStr : 'Selecciona una fecha' }}</span>
      </div>

      <div class="cal-header">

        <button class="mes-anio-btn" (click)="toggleSelectorAnio()">
          {{ meses[mesActual] }} {{ anioActual }}
          <span>{{ mostrarSelectorAnio ? '▴' : '▾' }}</span>
        </button>

        <div class="nav-btns" *ngIf="!mostrarSelectorAnio">

          <button class="nav-btn" (click)="mesAnterior()">
            <ion-icon name="chevron-back-outline"></ion-icon>
          </button>

          <button class="nav-btn" (click)="mesSiguiente()">
            <ion-icon name="chevron-forward-outline"></ion-icon>
          </button>

        </div>

      </div>

      <!-- SELECTOR DE AÑO -->
      <div class="anio-selector" *ngIf="mostrarSelectorAnio">

        <div
          *ngFor="let a of anios"
          class="anio-item"
          [class.anio-seleccionado]="a === anioActual"
          (click)="seleccionarAnio(a)">
          {{ a }}
        </div>

      </div>

      <!-- CALENDARIO -->
      <div *ngIf="!mostrarSelectorAnio">

        <div class="dias-semana">
          <span *ngFor="let d of diasSemana">{{ d }}</span>
        </div>

        <div class="dias-grid">

          <div
            *ngFor="let dia of diasCalendario"
            class="dia"
            [class.vacio]="!dia"
            [class.seleccionado]="esSeleccionado(dia)"
            [class.hoy]="esHoy(dia)"
            (click)="seleccionarDia(dia)">
            {{ dia ? dia.getDate() : '' }}
          </div>

        </div>

      </div>

      <div class="cal-actions">
        <button class="cal-cancel" (click)="cerrarCalendario()">Cancelar</button>
        <button class="cal-accept" (click)="aceptar()">Aceptar</button>
      </div>

    </div>

  </div>

  <!-- BOTÓN -->
  <div class="bottom-btn">
    <button
      [disabled]="!fecha || !esMayorDeEdad"
      (click)="guardar()">
      Guardar cambios
    </button>
  </div>

</ion-content>
