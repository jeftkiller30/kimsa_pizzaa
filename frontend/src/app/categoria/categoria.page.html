<ion-content [fullscreen]="true" class="categoria-page">

  <div class="cat-header">
    <button class="back-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h1 class="cat-title">Menú</h1>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        type="text"
        placeholder="Busca en nuestro menú"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        class="search-input"
      />
    </div>
  </div>

  <div class="tabs-scroll">
    <div class="tabs-wrapper">
      <div class="tab-item"
           *ngFor="let cat of categories"
           [class.active]="cat.active"
           (click)="selectCategory(cat)">
        <div class="tab-icon-wrapper">
          <img [src]="cat.icon" [alt]="cat.name" />
        </div>
        <span class="tab-label" [class.active]="cat.active">{{ cat.name }}</span>
        <div class="tab-underline" *ngIf="cat.active"></div>
      </div>
    </div>
  </div>

  <!-- 🔥 PRODUCTOS -->
  <div class="products-grid">
    <div class="product-card"
         *ngFor="let p of filteredProducts; let i = index"
         (click)="openProductDetail(p)">
      <div class="product-img-wrapper">
        <img [src]="p.imagen" [alt]="p.nombre" class="product-img" />
      </div>
      <div class="product-info">
        <span class="product-name">{{ p.nombre }}</span>
        <span class="product-desc">{{ p.descripcion }}</span>
        <span class="product-price">S/ {{ p.precio | number:'1.2-2' }}</span>
      </div>
    </div>
  </div>

  <!-- 🔄 Loader -->
  <div class="empty-state" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando productos...</p>
  </div>

  <!-- ❌ Sin resultados -->
  <div class="empty-state" *ngIf="!isLoading && filteredProducts.length === 0">
    <ion-icon name="search-outline"></ion-icon>
    <p>No encontramos "{{ searchQuery }}"</p>
  </div>

</ion-content>
